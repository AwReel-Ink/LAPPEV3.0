<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#16213e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>LAPPEV 3.0.x1</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="stylesheet" href="./css/app.css">
    <script src="./version.js"></script>
</head>
<body>

<header class="app-header">
    <a class="brand" href="#/clients" aria-label="Accueil LAPPEV">
        <img src="./icon-192.png" alt="">
        <span class="brand-name">LAPPEV</span>
        <span class="brand-version" id="brand-version"></span>
    </a>
    <nav class="top-nav" id="top-nav" aria-label="Navigation principale"></nav>
    <button class="ui-toggle" id="ui-toggle" type="button" title="Changer d'interface (PC / Tablette-Smartphone)"></button>
</header>

<div class="update-banner" id="update-banner" hidden>
    <span>Nouvelle version installée.</span>
    <button class="btn" type="button" id="update-reload">Recharger</button>
</div>

<main class="main" id="main"></main>

<nav class="bottom-nav" id="bottom-nav" aria-label="Navigation"></nav>

<div class="toasts" id="toasts" aria-live="polite"></div>

<noscript>
    <p style="padding:20px">LAPPEV a besoin de JavaScript pour fonctionner.</p>
</noscript>

<script type="module" src="./js/app.js"></script>
</body>
</html>
